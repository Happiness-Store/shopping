<div class="rakhi-container">

  <h1>Rakhi Collection</h1>

  <div class="product-grid">

    @for (product of products; track product.id) {

      <div class="product-card">
 {{product.name}}
        <img
          [src]="product.image_url"
          [alt]="product.name"
        />

        <div class="product-details">

          <h3>{{ product.name }}</h3>

          <p class="description">
            {{ product.description }}
          </p>

          <div class="price">
            ₹{{ product.price }}
          </div>

          <button (click)="buyNow(product)">
            <!-- <a
        class="whatsapp-btn"
        href="https://wa.me/918483881691?text=Hi,I want to buy Kids Rakhi"
        target="_blank">
        Buy Now
      </a> -->
            Buy Now
          </button>

        </div>

      </div>

    }

  </div>

</div>
