<div class="login-page">

  <div class="login-card">

    <div class="login-logo">
      🛍️
    </div>

    <h1>Welcome Back</h1>

    <p>Login to Happiness Store</p>

    <form (ngSubmit)="login()">

      <div class="form-group">

        <label>Email</label>

        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Enter your email"
          required
        />

      </div>

      <div class="form-group">

        <label>Password</label>

        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter your password"
          required
        />

      </div>
   @if(errorMessage) {
  <div
        class="error-message"
      >
        {{ errorMessage }}
      </div>
   }
    

      <button
        type="submit"
        [disabled]="isLoading"
      >
        {{ isLoading ? 'Logging in...' : 'Login' }}
      </button>

    </form>

  </div>

</div>
