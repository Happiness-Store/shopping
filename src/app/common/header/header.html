<header class="store-header">

  <div class="container header-content">

    <!-- Logo -->
    <a class="store-logo" routerLink="/">
      <span class="logo-icon">🌸</span>
      <span>Happiness Store</span>
    </a>

    <!-- Navigation -->
    <nav class="nav-links">

      <a routerLink="/rakhi"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">
        Rakhis
      </a>

      <!-- <a routerLink="/return-gifts"
         routerLinkActive="active">
        Return Gifts
      </a> -->

      <a routerLink="/festive-collection"
         routerLinkActive="active">
        Festive Collection
      </a>
     <!-- <a routerLink="/admin"
         routerLinkActive="active">
        Admin
      </a> -->
      @if(authService.isAdmin()) {
         <a  routerLink="/admin">
            Admin
          </a>
      }
          @if(!authService.isLoggedIn()) {
           <a  routerLink="/admin/login">
                  Login
                </a>
          }
        @if(authService.isLoggedIn()) {
         <button (click)="logout()">
            Logout
          </button>
        }
          
       
    </nav>

  </div>

</header>
